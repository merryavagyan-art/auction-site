<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot 12 — Evening Square with a Fruit Cart — Աճուրդ</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Achurd — shared styles. Tokens from DESIGN.md v0.2. No gradients; weights 400/500 only; accent on bid actions only. */
:root{
  --bg:#EEEDE7; --bg-2:#E5E4DC; --bg-3:#DCDBD1; --inverse:#121212; --white:#FFFFFF;
  --ink:#121212; --ink-hover:#302F29; --ink-2:#5F5E56; --accent:#DE204E; --accent-hover:#C41A43;
  --serif:"Noto Serif","Noto Serif Armenian",Georgia,serif;
  --sans:"Noto Sans","Noto Sans Armenian","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(0.215,0.61,0.355,1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:.01em}
a{color:var(--ink)}a:hover{color:var(--ink-hover)}
input,select,button,textarea{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab-nums{font-variant-numeric:tabular-nums}
.wrap{max-width:1920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:768px){.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}}
@media (min-width:1200px){.wrap{padding-left:40px;padding-right:40px}}

/* type */
.eyebrow{margin:0;font-size:14px;font-weight:500}
.display{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(34px,9vw,48px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
@media (min-width:768px){.display{font-size:clamp(36px,6.4vw,96px)}}
.statement{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,56px);line-height:1.05;text-wrap:balance}
.h2{margin:0;font-family:var(--serif);font-weight:400;font-size:36px;line-height:1}
.serif-it{font-family:var(--serif);font-style:italic;font-weight:400}
.muted{color:var(--ink-2)}
.small{font-size:14px}.caption{font-size:12px}

/* text roll (lcg.media) */
.roll{display:inline-block;overflow:hidden;height:1.2em;line-height:1.2em;vertical-align:middle}
.roll>span{display:inline-block;position:relative;transition:transform .8s var(--ease)}
.roll>span::after{content:attr(data-text);position:absolute;left:0;top:100%;white-space:nowrap}
.roll-host:hover .roll>span,.roll-host:focus-visible .roll>span{transform:translateY(-100%)}

/* ===== Buttons: one set for every page ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:0;border-radius:999px;font-family:var(--sans);font-size:14px;font-weight:500;line-height:1;letter-spacing:.01em;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color .3s var(--ease),color .3s var(--ease)}
.btn--ink{background:var(--ink);color:var(--white)}.btn--ink:hover{background:var(--ink-hover);color:var(--white)}
.btn--soft{background:var(--bg-2);color:var(--ink)}.btn--soft:hover{background:var(--bg-3);color:var(--ink)}
.btn--bid{background:var(--accent);color:var(--white);min-height:56px;font-size:16px}.btn--bid:hover{background:var(--accent-hover);color:var(--white)}
.btn--line{background:transparent;color:var(--white);box-shadow:inset 0 0 0 1px var(--ink-2)}.btn--line:hover{box-shadow:inset 0 0 0 1px var(--white);color:var(--white)}
.btn--line[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:none}
.btn--sm{min-height:40px;padding:0 16px}
.btn--block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:0;border-radius:999px;background:var(--bg-2);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none}
.chip:hover{background:var(--bg-3)}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--ink);color:var(--white)}
.link{display:inline-flex;align-items:center;min-height:44px;padding:0;border:0;background:none;color:inherit;font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:5px;cursor:pointer}
.tabbar{display:flex;flex-wrap:wrap;gap:32px;border-bottom:1px solid var(--bg-3)}
.tab{min-height:56px;padding:0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink);font-size:16px;cursor:pointer}
.tab[aria-selected="true"]{border-bottom-color:var(--ink);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge--win{background:var(--ink);color:var(--white)}
.badge--out{background:var(--bg-3);color:var(--ink)}
.badge--soft{background:var(--bg);color:var(--ink)}

/* header */
.site-header{border-bottom:1px solid var(--bg-3);background:var(--bg)}
.site-header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px;padding-top:16px;padding-bottom:16px}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none}
.brand b{font-family:var(--serif);font-weight:400;font-size:28px}
.brand span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.nav{display:flex;flex-wrap:wrap;gap:4px 28px;font-size:14px;font-weight:500}
.nav a{text-decoration:none;padding:12px 0}
.nav a[aria-current="page"]{text-decoration:underline;text-underline-offset:8px}
.tools{display:flex;align-items:center;gap:12px}
.langs{display:flex;background:var(--bg-2);border-radius:999px;padding:4px}
.lang{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:36px;border:0;border-radius:999px;background:transparent;color:var(--ink);font-size:14px;font-weight:500;text-decoration:none;cursor:pointer}
.lang:hover{background:var(--bg-3)}
.lang[aria-pressed="true"],.lang[aria-current="true"]{background:var(--bg-3)}
.site-footer{background:var(--inverse);color:var(--white);margin-top:96px}
.site-footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:32px;padding-top:48px;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));font-size:14px}
.site-footer a{color:var(--white)}
.site-footer nav{display:flex;flex-direction:column;gap:8px}

/* cards & grids */
.frame{background:var(--bg-2);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.frame img{max-width:100%;max-height:100%;display:block}
.lot-card{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.lot-card .frame{aspect-ratio:1/1;padding:12%;overflow:hidden}
.lot-card .frame img{transition:transform .6s var(--ease)}
.lot-card:hover .frame img{transform:scale(1.04)}
.hairline{display:grid;gap:1px;background:var(--bg-3)}
.hairline>*{background:var(--bg)}
.panel{background:var(--bg-2);padding:24px}
.section{border-top:1px solid var(--ink);padding-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:32px 48px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:500}
.input{min-height:52px;padding:0 16px;border:0;border-radius:0;background:var(--bg-2);font-size:16px;width:100%}
.row{display:flex;justify-content:space-between;gap:16px}

/* hero (DESIGN.md §4.4) */
.hero{position:relative;overflow:hidden}
.hero-stage{position:absolute;left:0;right:0;top:0;overflow:hidden;background:var(--bg);will-change:transform}
.hero-card{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;transition:opacity .3s var(--ease);background:var(--bg-3);display:block}
.hero-card img{display:block;width:100%;height:100%}
.hero-intro{position:absolute;left:40px;top:50%;transform:translateY(-50%);width:min(760px,58%);z-index:20}
.hero-intro-inner{display:flex;flex-direction:column;gap:24px}
.hero-label{position:absolute;left:0;top:0;z-index:15;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);font-size:12px;line-height:1.4}
.hero-label b{display:block;font-weight:500}
.hero-label span{display:block;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hero-center{position:absolute;left:0;top:0;z-index:12;opacity:0;text-align:center;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.hero-bars{position:absolute;left:62%;top:50%;width:min(420px,30%);z-index:12;pointer-events:none;opacity:0;display:flex;flex-direction:column;gap:16px}
.hero-bars ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hero-bars li{display:grid;grid-template-columns:7em minmax(0,1fr) 2.5em;align-items:center;gap:12px;font-size:14px}
.bar-track{display:block;height:8px;background:var(--bg-3);position:relative;overflow:hidden}
.bar-fill{position:absolute;inset:0;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.tag{font-size:12px;font-weight:500;line-height:1;background:var(--bg-3);border-radius:999px;padding:4px 8px}
.hero-tip{position:absolute;left:0;top:0;z-index:40;background:var(--bg-2);padding:12px 16px;min-width:200px;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.hero-steps{position:absolute;right:56px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.hero-step{min-height:32px;padding:0 12px;border:0;border-radius:999px;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink);background:transparent;opacity:.55}
.hero-step[aria-pressed="true"]{background:var(--bg-3);opacity:1}
.hero-rail{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:1px;height:120px;background:var(--bg-3);z-index:30}
.hero-rail i{position:absolute;inset:0;background:var(--ink);transform-origin:50% 0;transform:scaleY(0)}
.hero-hint{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30}
.word-box{display:inline-grid;vertical-align:baseline}
.word{grid-area:1/1;font-style:italic;white-space:nowrap;transition:transform .8s var(--ease),opacity .8s var(--ease)}
@media (max-width:767px){
  .hero-intro{left:16px;right:16px;width:auto;top:auto;bottom:88px;transform:none}
  .hero-intro-inner{gap:16px}
  .hero-bars{left:16px;right:16px;width:auto;top:auto;bottom:24px}
  .hero-bars li{grid-template-columns:6.5em minmax(0,1fr) 2em}
  .hero-steps{right:auto;left:16px;top:16px;transform:none;flex-direction:row}
  .hero-rail{right:16px;height:80px}
  .hero-label span{display:none}
  .nav{order:3;width:100%;gap:4px 20px}
  .brand span{display:none}
  .site-header .wrap{gap:4px 16px;padding-top:12px;padding-bottom:4px}
}

.trk[data-active="true"]{border-top-color:var(--ink)!important;font-weight:500}

/* dialog */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(18,18,18,.48);display:flex;align-items:flex-start;justify-content:center;padding:96px 16px 16px;overflow:auto}
.dialog{width:min(520px,100%);background:var(--bg);padding:24px 32px 32px;display:flex;flex-direction:column;gap:16px}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.steps4 span{height:3px;background:var(--bg-3)}
.steps4 span[data-active="true"]{background:var(--ink)}
.icon-btn{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:999px}
.icon-btn:hover{background:var(--bg-2)}

@media (prefers-reduced-motion:reduce){
  .roll>span,.hero-card,.word,.lot-card .frame img,.btn{transition:none}
  .roll-host:hover .roll>span,.lot-card:hover .frame img{transform:none}
}
</style>
</head>
