<script>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { step: 'idle', auth: 0, signedIn: null, cur: 1200, mine: undefined, amt: 1300, amtText: '$1,300', err: '', raced: false, extra: [], pending: false };
  }
  renderVals() {
    const P = this.props, st = this.state;
    const sc = P.scenario ?? 'Open';
    const propSigned = (P.viewer ?? 'Guest') === 'Signed in';
    const signedIn = st.signedIn === null ? propSigned : st.signedIn;
    const paddle = propSigned ? '142' : '226';
    const mine = st.mine !== undefined ? st.mine : (propSigned ? 1100 : null);
    const cur = st.cur, next = cur + 100;
    const fmt = (x) => '$' + Math.round(x).toLocaleString('en-US');
    const amd = (x) => '≈ ֏ ' + (Math.round(x * 385 / 1000) * 1000).toLocaleString('en-US');
    const prem = (x) => Math.min(x, 5000) * 0.2 + Math.max(x - 5000, 0) * 0.15;
    const open = sc === 'Open' || sc === 'Closing — extended';
    const winning = open && mine !== null && mine === cur;
    const outbid = open && signedIn && mine !== null && mine < cur;
    const badge = (bg, fg) => 'display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 2px; white-space: nowrap; background: ' + bg + '; color: ' + fg;

    const base = [
      ['087', 1200, 'Sat 6 Feb, 21:14'], ['142', 1100, 'Sat 6 Feb, 19:02'], ['031', 1000, 'Fri 5 Feb, 23:40'],
      ['087', 900, 'Fri 5 Feb, 12:18'], ['205', 800, 'Thu 4 Feb, 09:55']
    ].map((r) => ({ who: 'Bidder #' + r[0] + (signedIn && r[0] === paddle ? ' (you)' : ''), amt: fmt(r[1]), time: r[2] }));
    const history = st.extra.concat(base);

    // defaults: live lot
    let v = {
      priceLabel: 'Current bid · ' + (14 + st.extra.length) + ' bids', current: fmt(cur), currentAmd: amd(cur),
      showBadge: winning || outbid, badgeText: winning ? 'You’re winning' : 'Outbid',
      badgeStyle: winning ? badge('#E3EEE6', '#1F5C3E') : badge('#F6E8D2', '#7A4300'),
      bCheck: winning, bAlert: outbid, bLock: false, bClock: false,
      timeLabel: 'Time left', timeValue: '1d 22h 14m', closesLabel: 'Closes', closesText: 'Sun 7 Feb, 20:02',
      timeLabelStyle: 'color: #5E5A53', timeStyle: 'margin: 0; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums',
      reserveText: '✓ Reserve met', showMsg: false
    };
    if (sc === 'Closing — extended') {
      Object.assign(v, { timeLabel: 'Extended · a bid came in', timeValue: '1:58', closesText: 'Sun 7 Feb, 20:04:31',
        timeLabelStyle: 'color: #7A1F2B; font-weight: 600', timeStyle: 'margin: 0; font-size: 22px; font-weight: 600; color: #7A1F2B; font-variant-numeric: tabular-nums' });
      if (!winning && !outbid) Object.assign(v, { showBadge: true, badgeText: 'Extended +2:00', badgeStyle: badge('#7A1F2B', '#FFFFFF'), bClock: true, bAlert: false });
    }
    const M = {
      'Upcoming': { priceLabel: 'Starting bid', price: 600, tl: 'Opens in', tv: '3d 4h', cl: 'Opens', ct: 'Mon 1 Feb, 12:00', b: null, title: 'Bidding opens Mon 1 Feb, 12:00 (your time).', text: 'Follow the lot and we’ll remind you when it opens and 10 minutes before it closes.', link: 'Follow this lot', href: '#', kind: 'secondary', reserve: 'Not yet met' },
      'Closed — you won': { priceLabel: 'Sold · 16 bids · Final', price: 1400, tl: 'Bidding', tv: 'Closed · Final', cl: 'Closed', ct: 'Sun 7 Feb, 20:04:31', b: ['You won', badge('#E3EEE6', '#1F5C3E'), 'check'], title: 'You won Lot 03 for $1,400.', text: 'Pay $1,680 (incl. premium and VAT) by Tue 9 Feb, 20:04 your time. Card, Idram or bank transfer.', link: 'Pay now', href: 'account.html', kind: 'primary', reserve: '✓ Reserve met' },
      'Closed — sold': { priceLabel: 'Sold for · 16 bids', price: 1400, tl: 'Bidding', tv: 'Closed · Final', cl: 'Closed', ct: 'Sun 7 Feb, 20:04:31', b: ['Sold · Final', badge('#E6E1D6', '#1A1917'), 'lock'], title: 'Auction ended — sold for $1,400.', text: 'This result is final and never re-opens. Price, bids and estimate stay visible.', link: 'Back to the sale', href: 'sale.html', kind: 'secondary', reserve: '✓ Reserve met' },
      'Not sold': { priceLabel: 'Highest bid · 3 bids', price: 900, tl: 'Bidding', tv: 'Closed · Final', cl: 'Closed', ct: 'Sun 7 Feb, 20:02', b: ['Not sold · Final', badge('#E6E1D6', '#3D3A35'), 'lock'], title: 'Not sold — reserve not met.', text: 'This result is final. Interested in the work? Ask us — the artist may sell it privately.', link: 'Contact us', href: '#artist', kind: 'secondary', reserve: 'Not met' },
      'Cancelled': { priceLabel: 'Last bid before withdrawal', price: 1200, tl: 'Bidding', tv: 'Cancelled', cl: 'Cancelled', ct: 'Sun 7 Feb, 19:40', b: ['Cancelled', badge('#1A1917', '#F7F5F0'), 'lock'], title: 'This lot was withdrawn from the sale.', text: 'All bids on it are void and nobody will be charged. Everyone who bid or followed it has been emailed.', link: 'Back to the sale', href: 'sale.html', kind: 'secondary', reserve: '—' },
      'Connection lost': { title: 'Connection lost — your last confirmed bid is safe.', text: 'A bid sent while offline shows as pending and is never shown as accepted until we confirm it.', link: 'Reconnecting…', kind: 'disabled' },
      'Blocked': { title: 'You can’t bid on this auction.', text: 'Please contact us and we’ll explain.', link: 'Contact us', href: '#artist', kind: 'secondary' }
    };
    const m = M[sc];
    if (m) {
      v.showMsg = true;
      Object.assign(v, { msgTitle: m.title, msgText: m.text, msgLink: m.link, msgHref: m.href || '#', msgPrimary: m.kind === 'primary', msgSecondary: m.kind === 'secondary', msgDisabled: m.kind === 'disabled' });
      if (m.price) Object.assign(v, { priceLabel: m.priceLabel, current: fmt(m.price), currentAmd: amd(m.price), timeLabel: m.tl, timeValue: m.tv, closesLabel: m.cl, closesText: m.ct, reserveText: m.reserve, timeStyle: 'margin: 0; font-size: 18px; font-weight: 500' });
      if (m.b) Object.assign(v, { showBadge: true, badgeText: m.b[0], badgeStyle: m.b[1], bCheck: m.b[2] === 'check', bLock: m.b[2] === 'lock', bAlert: false, bClock: false });
      else if (m.price) v.showBadge = false;
      if (sc === 'Connection lost') Object.assign(v, { showBadge: true, badgeText: 'Offline', badgeStyle: badge('#F6E8D2', '#7A4300'), bAlert: true, bCheck: false });
    }
    const step = open ? st.step : 'none';
    const amt = st.amt;
    const amtErr = !!st.err;
    const authLabels = ['', 'STEP 1 OF 4 · SIGN IN', 'STEP 2 OF 4 · CODE', 'STEP 3 OF 4 · NAME & RULES', 'STEP 4 OF 4 · CARD'];

    return Object.assign(v, {
      signedIn, guest: !signedIn, paddle,
      showBanner: outbid && step !== 'confirm' && step !== 'conflict',
      mineText: mine !== null ? fmt(mine) : '',
      nextBid: fmt(next), nextTotal: fmt(next + prem(next)),
      showIdle: step === 'idle', showCustom: step === 'custom', showHigh: step === 'high', showConfirm: step === 'confirm',
      showConflict: step === 'conflict', showPlaced: step === 'placed',
      amtText: st.amtText, hasErr: amtErr, err: st.err, amtInvalid: amtErr ? 'true' : 'false',
      amtStyle: 'min-height: 52px; padding: 0 14px; border-radius: 2px; font-size: 20px; font-weight: 500; border: ' + (amtErr ? '2px solid #7A1F2B' : '1px solid #1A1917'),
      amtFmt: fmt(amt), amtPrem: fmt(prem(amt)), amtTotal: fmt(amt + prem(amt)), amtAmd: amd(amt),
      premLabel: amt > 5000 ? 'Buyer’s premium 20% / 15%, incl. VAT' : 'Buyer’s premium 20%, incl. VAT',
      bidCount: 14 + st.extra.length, history,
      onBid: () => this.setState(signedIn ? { step: 'confirm', amt: next, err: '' } : { auth: 1, pending: true, amt: next }),
      openCustom: () => this.setState({ step: 'custom', amtText: fmt(next), err: '' }),
      setAmt: (e) => this.setState({ amtText: e.target.value, err: '' }),
      review: () => {
        const n = parseInt(String(st.amtText).replace(/[^0-9]/g, ''), 10);
        if (!n || n < next || n % 100 !== 0) { this.setState({ err: 'Bids go up in steps of $100. The lowest you can bid is ' + fmt(next) + '.' }); return; }
        if (!signedIn) { this.setState({ auth: 1, pending: true, amt: n }); return; }
        this.setState({ step: n > 3 * cur ? 'high' : 'confirm', amt: n, err: '' });
      },
      toConfirm: () => this.setState({ step: 'confirm' }),
      cancel: () => this.setState({ step: 'idle', err: '' }),
      confirm: () => {
        if (P.race && !st.raced) {
          this.setState({ step: 'conflict', cur: amt, raced: true, extra: [{ who: 'Bidder #087', amt: fmt(amt), time: 'Just now' }].concat(st.extra) });
          return;
        }
        this.setState({ step: 'placed', cur: amt, mine: amt, extra: [{ who: 'Bidder #' + paddle + ' (you)', amt: fmt(amt), time: 'Just now' }].concat(st.extra) });
      },
      retry: () => this.setState({ step: 'confirm', amt: next }),
      outbidMe: () => this.setState({ step: 'idle', cur: cur + 100, extra: [{ who: 'Bidder #087', amt: fmt(cur + 100), time: 'Just now' }].concat(st.extra) }),
      signIn: () => this.setState({ auth: 1, pending: false }),
      authOpen: st.auth > 0, a1: st.auth === 1, a2: st.auth === 2, a3: st.auth === 3, a4: st.auth === 4,
      authCanBack: st.auth > 1, authLabel: authLabels[st.auth] || '',
      authBars: [1, 2, 3, 4].map((i) => ({ style: 'height: 3px; background: ' + (i <= st.auth ? '#1A1917' : '#DDD8CE') })),
      pendingText: st.pending ? 'your ' + fmt(amt) + ' bid' : 'everything',
      authFinish: st.pending ? 'Verify card & review my bid' : 'Verify card',
      authNext: () => {
        if (st.auth < 4) { this.setState({ auth: st.auth + 1 }); return; }
        this.setState({ auth: 0, signedIn: true, mine: null, pending: false, step: st.pending ? (amt > 3 * cur ? 'high' : 'confirm') : 'idle' });
      },
      authBack: () => this.setState({ auth: st.auth - 1 }),
      authClose: () => this.setState({ auth: 0, pending: false })
    });
  }
}
</script>
